# This project's own CI jobs (a test in another language, a second build target, a scheduled check): ci.yml runs this
# file beside the template's checks, the build waits for it, and so does ci-ok. The file is the project's: an update never
# changes it.
name: Project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gpu:
    name: The GPU tests pass on a software Vulkan adapter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BT_GPU: llvmpipe
      BT_GPU_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Mesa's software Vulkan driver (lavapipe) and the Vulkan loader
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the locked crates (cargo fetch)
        run: cargo fetch --locked
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      # A test binary that crashes (SIGSEGV seen on lavapipe) names no test: the core file it leaves does, as libtest names
      # each test's thread, and the next step prints every thread's stack from it.
      - name: The core's Rust tests with the GPU compositor on lavapipe (poe rust-test-gpu)
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/core.%p"
          uv run --locked poe rust-test-gpu
      - name: A crash's threads and stacks (gdb on the core file)
        if: failure()
        run: |
          sudo apt-get install --yes --no-install-recommends gdb
          for core in "$RUNNER_TEMP"/core.*; do
            [ -e "$core" ] || continue
            binary=$(gdb -batch -c "$core" 2>/dev/null | sed -n "s/^Core was generated by \`\([^ ']*\).*/\1/p")
            gdb -batch -ex "info threads" -ex "thread apply all bt 40" "$binary" "$core"
          done
      - name: The Python package's GPU tests on lavapipe (pytest tests/test_gpu.py)
        run: uv run --locked pytest -q -n 0 -ra tests/test_gpu.py
