# cargo-deny (it cannot read Cargo.toml): which Rust crates the project may depend on. `poe check` runs the offline
# checks (bans, licenses, sources); `poe audit` adds the advisories, which need the network.

[graph]
all-features = true

[advisories]
ignore = []  # an advisory with no fixed release is ignored here by id, with a reason, and listed in SECURITY.md

[licenses]
# permissive licences that ask no more of the package than its own MIT does (notices kept, no copyleft)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",  # delaunator (via bullterrier-image)
    "Zlib",  # foldhash (via hashbrown, which serde_json's `preserve_order` map uses)
    "BSD-3-Clause",  # alloc-no-stdlib (via brotli-decompressor, wuff, bullterrier-vector: WOFF2 fonts)
]
confidence-threshold = 0.93

# bullterrier-vector bundles fonts under the SIL Open Font License 1.1 (each with its OFL.txt in that crate); no other
# crate may carry the licence
[[licenses.exceptions]]
crate = "bullterrier-vector"
allow = ["OFL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # the workspace's own crates depend on each other by path
# Python reaches the core only through the bindings crate: the core stays pure Rust, with no PyO3 in it
deny = [
    { crate = "pyo3", wrappers = ["bullterrier-scene-python", "numpy"] },
    { crate = "numpy", wrappers = ["bullterrier-scene-python"] },
    # pyo3's FFI layer and build script; the numpy crate also builds against the build script
    { crate = "pyo3-ffi", wrappers = ["pyo3"] },
    { crate = "pyo3-build-config", wrappers = ["pyo3", "pyo3-ffi", "numpy"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# the two sibling crates, pinned by revision in Cargo.toml: neither is published (docs/design-decisions.md)
allow-git = [
    "https://github.com/bullterrier-studio/bullterrier-image",
    "https://github.com/bullterrier-studio/bullterrier-vector",
]
