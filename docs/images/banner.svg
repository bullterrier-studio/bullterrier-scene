<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Four layers, a photo, a cut-out, a headline and grain, rendered into one poster">
<title>Four layers rendered into one poster</title>
<defs><image id="dog" width="400" height="400" href="data:image/svg+xml;base64,"/></defs>
<rect width="1200" height="380" rx="18" fill="#15131c"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
  <rect x="70" y="70" width="230" height="150" rx="10" fill="#2f2b45"/>
  <use href="#dog" transform="translate(80 132) scale(0.145)"/>
  <text x="84" y="94" fill="#c9c4e8">photo</text>

  <rect x="140" y="110" width="230" height="150" rx="10" fill="#ff2b6e" fill-opacity="0.92"/>
  <circle cx="290" cy="190" r="38" fill="#15131c" fill-opacity="0.55"/>
  <text x="154" y="134" fill="#fff">cut-out</text>

  <rect x="210" y="150" width="230" height="150" rx="10" fill="#f4f1ea"/>
  <rect x="226" y="198" width="150" height="12" rx="3" fill="#15131c"/>
  <rect x="226" y="222" width="190" height="12" rx="3" fill="#15131c"/>
  <rect x="226" y="246" width="110" height="12" rx="3" fill="#15131c"/>
  <text x="224" y="174" fill="#15131c">headline</text>

  <rect x="280" y="190" width="230" height="150" rx="10" fill="#222036" stroke="#6d6893" stroke-width="1.5"/>
  <g fill="#9f99cf">
    <circle cx="310" cy="250" r="2"/><circle cx="352" cy="274" r="2"/><circle cx="396" cy="244" r="2"/>
    <circle cx="438" cy="282" r="2"/><circle cx="470" cy="256" r="2"/><circle cx="332" cy="306" r="2"/>
    <circle cx="418" cy="316" r="2"/><circle cx="486" cy="302" r="2"/><circle cx="372" cy="232" r="2"/>
  </g>
  <text x="294" y="214" fill="#c9c4e8">grain</text>
</g>
<g stroke="#8d88b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M570 190 H690"/><path d="M672 172 L692 190 L672 208"/>
</g>
<text x="631" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c9c4e8">render</text>
<g>
  <rect x="780" y="40" width="270" height="300" fill="#ff2b6e"/>
  <rect x="915" y="40" width="135" height="120" fill="#1b2fd6"/>
  <rect x="780" y="230" width="135" height="110" fill="#0b0b0f"/>
  <use href="#dog" transform="translate(808 148) scale(0.2)"/>
  <rect x="915" y="250" width="135" height="90" fill="#0b0b0f"/>
  <g font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="40" fill="#0b0b0f">
    <text x="796" y="90">MORE</text><text x="796" y="132">LAYERS.</text>
  </g>
</g>
<text x="1105" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c9c4e8" transform="rotate(90 1105 196)" text-anchor="middle">one picture, any size</text>
</svg>
