[package]
name = "bullterrier-scene-cli"
description = "The command line of bullterrier-scene: `bt-scene`, as a library whose `main` the Python console script calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bullterrier_scene_cli"
# no doctests: the tests of tests/it/ are the examples (as in the core)
doctest = false

[features]
# `bt-scene render --gpu`
gpu = ["bullterrier-scene/gpu", "dep:pollster"]

[dependencies]
bullterrier-scene.workspace = true
clap.workspace = true
pollster = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
bullterrier-image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
