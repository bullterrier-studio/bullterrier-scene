[package]
name = "bullterrier-scene-python"
description = "The Python bindings of bullterrier-scene's Rust core: builds the extension `bullterrier_scene._native._core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
# no Rust tests of its own: the Python suite tests the extension through the package's public interface
test = false
doctest = false

[dependencies]
bullterrier-scene.workspace = true
pyo3.workspace = true

[lints]
workspace = true
