[package]
name = "bullterrier-scene"
description = "The core of bullterrier-scene: its logic, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bullterrier_scene"
# no doctests: edition 2024 merges them into one more executable (built and scanned on macOS), and the tests of
# tests/it/ are the examples.
# Set it to true only for a public item whose docs need a runnable bullterrier-scene.
doctest = false

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
