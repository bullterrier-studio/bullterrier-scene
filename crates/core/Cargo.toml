[package]
name = "bullterrier-scene"
description = "The core of bullterrier-scene: its logic, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bullterrier_scene"
# no doctests: edition 2024 merges them into one more executable (built and scanned on macOS), and the tests of
# tests/it/ are the examples.
# Set it to true only for a public item whose docs need a runnable bullterrier-scene.
doctest = false

[features]
# The GPU compositor (`Gpu`, `Gpu::render`): layers composed on a wgpu device, pictures chained with image's GPU context. Off by
# default (compile time; a CPU-only build is unchanged); the Python wheel and the command line enable it.
gpu = ["dep:wgpu", "bullterrier-image/gpu"]

[dependencies]
bullterrier-image.workspace = true
bullterrier-vector.workspace = true
miniz_oxide.workspace = true
moxcms.workspace = true
pdf-writer.workspace = true
png.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
lopdf.workspace = true
pollster.workspace = true
peak_alloc.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
