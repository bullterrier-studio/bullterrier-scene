# The Rust of bullterrier-scene: `crates/core` (pure Rust: the logic) and `crates/python` (the bindings that build
# `bullterrier_scene._native._core`; maturin builds it, see [tool.maturin] in pyproject.toml). Rust settings live here, except
# what a tool cannot read from this file: rust-toolchain.toml, rustfmt.toml, deny.toml.
[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/python"]

[workspace.package]
version = "0.0.0"  # never published on its own: the Python package's version (pyproject.toml) is the release's
edition = "2024"
rust-version = "1.99.1"  # the toolchain rust-toolchain.toml pins
license = "MIT"
repository = "https://github.com/bullterrier-studio/bullterrier-scene"
publish = false

[workspace.dependencies]
bullterrier-scene = { path = "crates/core" }
bullterrier-scene-cli = { path = "crates/cli" }
# The sibling crates, pinned to a revision (docs/design-decisions.md, "Image and vector come in as git dependencies"):
# bump `rev` in a commit of its own. Named in code only in crates/core/src/source/picture.rs and drawing.rs (tests read files with image). Neither is published.
bullterrier-image = { git = "https://github.com/bullterrier-studio/bullterrier-image", rev = "89b238f6dc0f17828e381b8b13163a406b3f7b75" }
bullterrier-vector = { git = "https://github.com/bullterrier-studio/bullterrier-vector", rev = "beff47d0e604cfe71b6e5023a2a9c0eb61d2aa11" }
clap = { version = "4", default-features = false, features = ["std", "string", "derive", "help", "usage", "error-context", "suggestions"] }  # the command line (`crates/cli`)
miniz_oxide = "0.9"  # the Flate encoder of a PDF's picture (already in the tree through png): `docs/design-decisions.md`, "PDF output"
moxcms = "0.8"  # RGB to a caller's CMYK profile (already in the tree through image)
numpy = "0.30"
pdf-writer = "0.15"  # writes the page's content stream; pdf.rs writes the objects
png = "0.18"  # the streaming PNG writer of a picture drawn by bands (already in the tree through image): `docs/design-decisions.md`, "Banded rendering"
proptest = "1.12"
rayon = "1.12"  # lays the rows of a layer on all cores (already in the tree through image; one thread on wasm32): `docs/design-decisions.md`, "Layers laid by rows on all cores"
lopdf = { version = "0.47", default-features = false }  # reads the PDF back in the tests: an oracle independent of the writer
tempfile = "3.27"
peak_alloc = "0.3"  # a counting global allocator: the peak-memory test of the PDF writer
# abi3-py312: one wheel per platform serves every Python from 3.12 (the oldest the package supports)
pyo3 = { version = "0.30", features = ["abi3-py312"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }  # a recipe's order is data (image's own setting); a saved scene reads back the number it wrote
serde = "1"  # the strict reader of a saved scene (a key written twice is refused)
sha2 = "0.10"  # the digest of a file a saved scene names (docs/design-decisions.md, "A saved scene")

# Warnings, not errors, so a newer compiler's new lint never breaks a user's install; the gate (`poe check`) runs clippy
# and rustdoc with `-D warnings`, so every one fails it.
[workspace.lints.rust]
missing_docs = "warn"  # ruff's D1xx: every public item is documented
unreachable_pub = "warn"  # `pub` only where a crate's users reach it; inside a crate, `pub(crate)`
unsafe_code = "deny"  # the core forbids it outright (`#![forbid(unsafe_code)]`); the bindings deny it too

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# restriction picks: no panicking shortcut (an error is returned), no printing (the library never prints)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# The tools the gate runs that rustup does not install, each at the version the gate expects. `uv run poe setup`
# installs them; `tools/rust_tools.py` reads this table, the one place their versions are written.
[workspace.metadata.tools]
cargo-shear = "1.14.0"
cargo-deny = "0.20.2"

# Debug builds keep file and line tables (panics and backtraces still name them) but no variable information, and on
# macOS the debug info stays in the binary: by default (`unpacked`) cargo leaves every object file of every build behind
# in target/debug/deps, never cleaned (measured in a sibling project: 1.1 million files, 38 GB after a week). `cargo test`
# uses the `test` profile, which inherits this one.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# Tests run lightly optimised: in a sibling project this took the Rust tests from 13 minutes to 33 seconds with the same
# assertions, and the default (opt-level 0) compiles code that is slow to run. The cost: a test of stack depth or frame size
# sees smaller frames (one measured 32-64 KB needed at opt-level 0, at most 8 KB at 1), so it bounds the recursion more loosely.
# A project with such a test sets `opt-level = 0` here, with its reason.
[profile.test]
opt-level = 1
